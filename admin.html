<!doctype html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin Panel · Admin Deal</title>
<script>(function(){var t='dark';try{t=localStorage.getItem('ad_theme')||'dark'}catch(e){}document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');})();</script>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2e59;--navy2:#1e4d8c;--teal:#0d9488;--teal2:#14b8a6;--buyer:#2563eb;--seller:#059669;--admin:#7c3aed;--bad:#dc2626;--warn:#d97706;--bg:#f3f6fb;--line:#e4e9f2;--muted:#64748b;--card:#fff;--text:#0f172a;--soft:#eef2f7;--chatbg:#eef3f9;--inbg:#fff;--inline:#cdd6e3;--sysbg:#dfe7f1;--syscol:#475569;--tabcol:#334155;--font:'Inter','Noto Sans Bengali',system-ui,sans-serif}
html[data-theme="dark"]{color-scheme:dark;--navy:#9ec5ff;--bg:#0b1220;--line:#243049;--muted:#93a1b8;--card:#131c2e;--text:#e6ebf5;--soft:#1b2740;--chatbg:#0e1628;--inbg:#0f1829;--inline:#2d3b58;--sysbg:#223048;--syscol:#b6c2d6;--tabcol:#c5d0e3}
html[data-theme="dark"] .chip{background:#1b2f55;color:#9ec5ff}
html[data-theme="dark"] .chip.warn{background:#4a3410;color:#fcd34d}
html[data-theme="dark"] .chip.ok{background:#064e3b;color:#6ee7b7}
html[data-theme="dark"] .chip.bad{background:#4c1d1d;color:#fca5a5}
html[data-theme="dark"] .toast{background:#e6ebf5;color:#0b1220}
.theme-btn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;cursor:pointer;font-size:16px;padding:0}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.5}
.appbar{position:sticky;top:0;z-index:10;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:linear-gradient(90deg,#0b2e59,#1e4d8c);color:#fff}
.appbar b{font-size:16.5px;letter-spacing:-.2px}
.appbar .who{font-size:12px;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:99px}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(15,23,42,.04);margin-bottom:14px}
h2{margin:0 0 8px;font-size:17px;color:var(--navy)}
.muted{color:var(--muted);font-size:12.5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:12px;font:600 13.5px var(--font);cursor:pointer;color:var(--tabcol)}
.tab.on{background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;border-color:transparent}
.tab .n{display:inline-block;min-width:18px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;margin-left:4px}
.btn{border:0;border-radius:10px;padding:9px 14px;font:600 13.5px var(--font);cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--navy2),var(--navy));margin:3px 4px 3px 0}
.btn.buyer{background:linear-gradient(135deg,#3b82f6,var(--buyer))}
.btn.seller{background:linear-gradient(135deg,#34d399,var(--seller))}
.btn.bad{background:linear-gradient(135deg,#f87171,var(--bad))}
.btn.teal{background:linear-gradient(135deg,var(--teal2),var(--teal))}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.block{width:100%}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--inline);border-radius:10px;font:14px var(--font);background:var(--inbg);color:var(--text);margin:4px 0 10px}
textarea{min-height:64px;resize:vertical}
label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.deal-item{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:13px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.deal-item:hover{border-color:#a5b4fc}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:#e6f0ff;color:var(--navy2)}
.chip.warn{background:#fef3c7;color:#b45309}.chip.ok{background:#d1fae5;color:#047857}.chip.bad{background:#fee2e2;color:#b91c1c}
.chat{height:52vh;min-height:260px;overflow-y:auto;padding:12px;background:var(--chatbg);border-radius:14px;border:1px solid var(--line)}
.msg{display:flex;gap:8px;margin:10px 0;align-items:flex-end}
.msg.me{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:block;object-fit:cover;background:#e4e9f2}
.av.admin{display:grid;place-items:center;background:linear-gradient(135deg,#a78bfa,var(--admin));font-size:14px;color:#fff}
.av.bot{background:#fff;padding:2px}
.bub{max-width:76%}
.lbl{font-size:11px;color:var(--muted);margin:0 6px 2px;font-weight:600}
.msg.me .lbl{text-align:right}
.txt{padding:9px 12px;border-radius:16px;color:#fff;white-space:pre-wrap;word-break:break-word}
.msg.buyer .txt{background:linear-gradient(135deg,#3b82f6,var(--buyer))}
.msg.seller .txt{background:linear-gradient(135deg,#34d399,var(--seller))}
.msg.admin .txt{background:linear-gradient(135deg,#a78bfa,var(--admin))}
.msg.bot .txt{background:var(--card);color:var(--text);border:1px solid #d5ece9;border-left:3px solid var(--teal2)}
.sysline{text-align:center;margin:10px 0;font-size:12px;color:var(--syscol)}
.sysline span{background:var(--sysbg);padding:3px 10px;border-radius:99px}
.composer{display:flex;gap:8px;margin-top:10px}
.composer input{margin:0;border-radius:99px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat-grid div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat-grid b{display:block;font-size:20px;color:var(--navy)}
.stat-grid span{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:99}
.login{max-width:380px;margin:60px auto}
.unread{border-left:4px solid var(--warn)}
.hidden{display:none!important}
.section-title{font-weight:800;color:var(--navy);margin:4px 0 10px;font-size:15px}
@media (max-width:720px){.stat-grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.chat{height:46vh}.bub{max-width:82%}}
</style>
</head>
<body>
<div class="appbar"><b>🛡️ Admin Deal · Control Panel</b><span style="display:flex;gap:8px;align-items:center"><button class="theme-btn" id="themeBtn" aria-label="Theme"></button><span class="who" id="who"></span></span></div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
function _applyTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('ad_theme',t)}catch(e){}document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌙';}
_applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'light':'dark');
document.getElementById('themeBtn').onclick=function(){_applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = t => { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = 'none', 2300); };
const dt = t => new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });

const LBL = { buyer: 'Buyer', seller: 'Seller', admin: 'Admin', bot: 'Bot' };
const STEP = {
  join: 'Waiting for members', amount: 'Waiting for amount', pay: 'Waiting for payment',
  verify: '⚠️ Verify payment', deliver: 'Waiting for delivery confirmation', release: '⚠️ Pay the seller', done: 'Completed'
};
const STATUS_CHIP = { active: 'warn', done: 'ok', cancelled: 'bad' };
const TEXT_KEYS = [
  ['welcome', 'Deal created'],
  ['joined', 'Both joined — placeholders: {buyer} {seller}'],
  ['amount', 'Amount prompt'],
  ['pay', 'Payment instructions — placeholders: {amount} {fee} {feeAmt} {total}'],
  ['payDetail', 'Payment number message — placeholders: {method} {number} {total}'],
  ['sent', 'Buyer says sent'], ['verified', 'Payment received'], ['notPaid', 'Payment not received'],
  ['received', 'Delivery confirmed'], ['done', 'Deal completed'], ['cancelled', 'Deal cancelled']
];

let KEY = sessionStorage.getItem('ak') || '';
let tab = 'deals', openRoom = null, notifUnread = 0, lastNotif = -1;

async function api(p, o = {}) {
  const r = await fetch('/api/' + p, {
    method: o.method || 'GET',
    headers: { 'content-type': 'application/json', 'x-admin-key': KEY },
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong');
  return d;
}

function loginView() {
  $('#app').innerHTML = `<div class="card login"><h2>Admin sign in · অ্যাডমিন লগইন</h2>
    <label>Admin password</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn block" id="lg">Enter</button></div>`;
  const go = async () => {
    KEY = $('#pw').value;
    try { await api('admin/login', { method: 'POST', body: {} }); sessionStorage.setItem('ak', KEY); shell(); }
    catch { toast('Wrong password'); }
  };
  $('#lg').onclick = go;
  $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}

function shell() {
  $('#who').textContent = 'Signed in';
  $('#app').innerHTML = `<div class="tabs">
      <button class="tab on" data-t="deals">📋 Deals</button>
      <button class="tab" data-t="reports">⚠️ Reports <span class="n hidden" id="rn"></span></button>
      <button class="tab" data-t="notifs">🔔 Notifications <span class="n hidden" id="nn"></span></button>
      <button class="tab" data-t="settings">⚙️ Settings</button>
      <button class="tab" data-t="logout">Log out</button>
    </div><div id="view"></div>`;
  show();
  setInterval(async () => {
    if (openRoom) { if (!$('#ms') || !$('#ms').value) roomView(openRoom); }
    else if (tab === 'deals' || tab === 'reports' || tab === 'notifs') show();
    badges();
  }, 4000);
  badges();
}

async function badges() {
  try {
    const n = await api('admin/notifs');
    const un = n.filter(x => !x.read).length;
    const nn = $('#nn'), rn = $('#rn');
    if (nn) { nn.textContent = un; nn.classList.toggle('hidden', !un); }
    if (lastNotif >= 0 && un > notifUnread && Notification.permission === 'granted' && n[0]) new Notification('Admin Deal', { body: n[0].text });
    notifUnread = un; lastNotif = n.length;
    const reps = (await api('admin/reports')).filter(x => x.status === 'open');
    if (rn) { rn.textContent = reps.length; rn.classList.toggle('hidden', !reps.length); }
  } catch {}
}

async function show() {
  const v = $('#view');
  try {
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
    if (tab === 'deals') {
      if (openRoom) return roomView(openRoom);
      const rs = await api('admin/rooms');
      const stats = `<div class="stat-grid">
        <div><b>${rs.length}</b><span>Deals</span></div>
        <div><b>${rs.filter(r => r.status === 'active').length}</b><span>In progress</span></div>
        <div><b>${rs.filter(r => r.status === 'done').length}</b><span>Completed</span></div>
        <div><b>${rs.filter(r => r.step === 'verify' || r.step === 'release').length}</b><span>Need action</span></div></div>`;
      v.innerHTML = stats + (rs.map(r => {
        const buyer = (r.members || []).find(x => x.role === 'buyer');
        const seller = (r.members || []).find(x => x.role === 'seller');
        const who = `ক্রেতা: ${esc(buyer ? buyer.name || '—' : '—')} · বিক্রেতা: ${esc(seller ? seller.name || '—' : '—')}`;
        return `<div class="deal-item" data-open="${esc(r.id)}">
          <div><b>Deal #${esc(r.id)}</b> <span class="chip ${STATUS_CHIP[r.status]}">${r.status}</span>
          <div class="muted">${who}</div>
          <div class="muted">${STEP[r.step]} · ${r.amount ? '৳' + r.amount : 'no amount'} · ${dt(r.t)}</div></div>
          <span class="chip">Open →</span></div>`;
      }).join('') || '<div class="card">No deals yet.</div>');
    }
    else if (tab === 'reports') {
      const list = await api('admin/reports');
      v.innerHTML = list.map(x => `<div class="card ${x.status === 'open' ? 'unread' : ''}">
          <div class="row" style="justify-content:space-between"><b>Deal #${esc(x.roomId)}</b>
          <span class="chip ${x.status === 'valid' ? 'bad' : x.status === 'dismissed' ? '' : 'warn'}">${x.status}</span></div>
          <div class="muted">Reported user: ${esc(x.against)} · by ${esc(x.by)} · ${dt(x.t)}</div>
          <p>${esc(x.reason)}</p>
          ${x.status === 'open' ? `<button class="btn bad" data-rep="${esc(x.id)}" data-act="valid">Confirm scam</button>
          <button class="btn ghost" data-rep="${esc(x.id)}" data-act="dismiss">Dismiss</button>` : ''}
        </div>`).join('') || '<div class="card">No reports.</div>';
    }
    else if (tab === 'notifs') {
      const n = await api('admin/notifs');
      v.innerHTML = `<div class="card"><button class="btn ghost" id="rd">Mark all as read</button></div>` +
        (n.map(x => `<div class="card ${x.read ? '' : 'unread'}"><div class="muted">${dt(x.t)}</div><div>${esc(x.text)}</div></div>`).join('')
          || '<div class="card">No notifications.</div>');
    }
    else if (tab === 'settings') await settingsView();
  } catch (e) { v.innerHTML = `<div class="card">${esc(e.message)}</div>`; }
}

async function settingsView() {
  const s = await api('settings');
  $('#view').innerHTML = `
    <div class="card">
      <h2>Fee, login and payment methods · ফি ও পেমেন্ট</h2>
      <div class="grid2">
        <div><label>Service fee (%)</label><input id="fee" type="number" step="0.1" min="0" value="${s.feePercent}"></div>
        <div><label>Google Client ID (optional)</label><input id="gid" value="${esc(s.googleClientId)}" placeholder="xxxx.apps.googleusercontent.com"></div>
      </div>
      <div class="grid2">
        <div><label>Facebook App ID (optional)</label><input id="fbid" value="${esc(s.fbAppId)}" placeholder="1234567890"></div>
        <div></div>
      </div>
      <label>Payment methods (one per line: name | number)</label>
      <textarea id="methods" style="min-height:96px">${esc(s.methods.map(x => `${x.name} | ${x.number}`).join('\n'))}</textarea>
    </div>
    <div class="card">
      <h2>Support links · সাপোর্ট লিংক</h2>
      <p class="muted">Support বাটনে এই লিংকগুলো দেখাবে। WhatsApp-এ শুধু নম্বর দিন (যেমন 8801XXXXXXXXX), Telegram-এ @username দিন বা পুরো লিংক দিন।</p>
      <div class="grid2">
        <div><label>WhatsApp (number or link)</label><input id="swa" value="${esc(s.supportWhatsapp)}" placeholder="8801XXXXXXXXX"></div>
        <div><label>Telegram (@username or link)</label><input id="stg" value="${esc(s.supportTelegram)}" placeholder="@yourusername"></div>
      </div>
    </div>
    <div class="card">
      <h2>Bot messages · বটের মেসেজ (Bangla)</h2>
      <p class="muted">বট এই টেক্সটগুলো প্রতিটি ধাপে চ্যাটে পাঠায়।</p>
      ${TEXT_KEYS.map(([k, l]) => `<label>${esc(l)}</label><textarea data-tk="${k}">${esc(s.texts[k])}</textarea>`).join('')}
    </div>
    <button class="btn block" id="sv">Save all settings · সব সেভ করুন</button>`;
}

async function roomView(id) {
  try {
    const rs = await api('admin/rooms');
    const r = rs.find(x => x.id === id);
    if (!r) { openRoom = null; return show(); }
    const keep = $('#ms') ? $('#ms').value : '';
    const ended = r.status !== 'active';
    let acts = '';
    if (!ended) {
      if (r.step === 'verify') acts += `<button class="btn buyer" data-ra="confirm">✅ Payment received</button><button class="btn ghost" data-ra="reject">❌ Not received</button>`;
      if (r.step === 'release') acts += `<button class="btn seller" data-ra="released">✅ Seller paid</button>`;
      acts += `<button class="btn bad" data-ra="cancel">Cancel deal</button>`;
    }
    const body = r.messages.map(m => {
      if (m.who === 'sys') return `<div class="sysline"><span>${esc(m.text)}</span></div>`;
      const isBot = m.who === 'bot', isAdm = m.who === 'admin';
      const label = isBot ? 'Escrow Bot' : isAdm ? 'Admin' : `${esc(m.name || LBL[m.who])} (${LBL[m.who]})`;
      const av = isBot ? `<img class="av bot" src="/assets/bot.svg" alt="">`
        : isAdm ? `<span class="av admin">🛡️</span>`
        : `<img class="av" src="/assets/avatar.svg" alt="">`;
      return `<div class="msg ${m.who} ${isAdm ? 'me' : ''}">${av}
        <div class="bub"><div class="lbl">${label}</div><div class="txt">${esc(m.text)}</div></div></div>`;
    }).join('');
    const buyer = (r.members || []).find(x => x.role === 'buyer');
    const seller = (r.members || []).find(x => x.role === 'seller');
    const people = `<div class="muted">ক্রেতা: ${esc(buyer ? buyer.name || '—' : '—')} · বিক্রেতা: ${esc(seller ? seller.name || '—' : '—')}</div>`;
    const info = r.amount ? `<div class="muted">Amount ৳${r.amount} · Fee ৳${r.fee} · Buyer pays ৳${r.total}${r.method ? ' · ' + esc(r.method.name) + ' ' + esc(r.method.number) : ''}</div>` : '';
    $('#view').innerHTML = `<div class="card">
      <div class="row" style="justify-content:space-between"><button class="btn ghost" data-back="1">← Back</button>
      <span class="chip ${STATUS_CHIP[r.status]}">${r.status}</span></div>
      <div class="row" style="margin-top:8px"><button class="btn ghost" data-copylink="1">🔗 Copy deal link</button></div>
      <h2 style="margin-top:10px">Deal #${esc(r.id)} · ${STEP[r.step]}</h2>
      ${people}${info}
      <div class="chat" id="chat" style="margin-top:10px">${body}</div>
      <div class="row" style="margin-top:10px">${acts}</div>
      ${ended ? '' : `<div class="composer"><input id="ms" placeholder="Message as Admin… · অ্যাডমিন হিসেবে মেসেজ"><button class="btn" data-ra="msg">Send</button></div>`}
    </div>`;
    if ($('#ms')) $('#ms').value = keep;
    $('#chat').scrollTop = $('#chat').scrollHeight;
  } catch (e) { $('#view').innerHTML = `<div class="card">${esc(e.message)}</div>`; }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button, [data-open]');
  if (!b) return;
  try {
    if (b.dataset.open) { openRoom = b.dataset.open; tab = 'deals'; return roomView(openRoom); }
    if (b.dataset.back) { openRoom = null; return show(); }
    if (b.dataset.copylink) {
      const url = location.origin + '/?room=' + openRoom;
      try { await navigator.clipboard.writeText(url); }
      catch { const t = document.createElement('textarea'); t.value = url; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
      return toast('Deal link copied');
    }
    if (b.dataset.t) {
      if (b.dataset.t === 'logout') { sessionStorage.removeItem('ak'); KEY = ''; return loginView(); }
      tab = b.dataset.t; openRoom = null; return show();
    }
    if (b.id === 'rd') { await api('admin/notifs/read', { method: 'POST', body: {} }); return show(); }
    if (b.dataset.rep) {
      await api('admin/reports/' + b.dataset.rep + '/action', { method: 'POST', body: { action: b.dataset.act } });
      toast('Updated'); return show();
    }
    if (b.id === 'sv') {
      const methods = $('#methods').value.split('\n').map(l => {
        const [name, number] = l.split('|').map(x => (x || '').trim());
        return { name, number };
      });
      const texts = {};
      document.querySelectorAll('[data-tk]').forEach(t => texts[t.dataset.tk] = t.value);
      await api('admin/settings', { method: 'POST', body: {
        feePercent: Number($('#fee').value), googleClientId: $('#gid').value,
        fbAppId: $('#fbid').value, supportWhatsapp: $('#swa').value, supportTelegram: $('#stg').value,
        methods, texts
      } });
      return toast('Settings saved');
    }
    if (b.dataset.ra) {
      const text = $('#ms') ? $('#ms').value.trim() : '';
      if (b.dataset.ra === 'msg' && !text) return toast('Write a message');
      if (b.dataset.ra === 'cancel' && !confirm('Cancel this deal?')) return;
      await api('admin/room/' + openRoom + '/action', { method: 'POST', body: { action: b.dataset.ra, text } });
      if ($('#ms')) $('#ms').value = '';
      return roomView(openRoom);
    }
  } catch (err) { toast(err.message); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'ms') document.querySelector('[data-ra="msg"]').click();
});

KEY ? shell() : loginView();
</script>
</body>
</html>
