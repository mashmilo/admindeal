<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>অ্যাডমিন প্যানেল</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f2f5;--card:#fff;--text:#1c1e21;--muted:#65676b;--line:#e4e6eb;--buyer:#2563eb;--seller:#16a34a;--admin:#d97706;--bot:#64748b;--primary:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans Bengali',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}
.top{background:#1f2937;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;font-weight:700}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:14px;padding:16px;border:1px solid var(--line);margin-bottom:14px}
.card.unread{border-left:4px solid var(--admin)}
h2{margin:0 0 6px;font-size:18px}
p{margin:6px 0;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{border:0;border-radius:10px;padding:9px 14px;font:600 14px 'Noto Sans Bengali',sans-serif;cursor:pointer;color:#fff;background:var(--primary);margin:3px 3px 3px 0}
.btn.admin{background:var(--admin)}.btn.seller{background:var(--seller)}.btn.buyer{background:var(--buyer)}
.btn.ghost{background:#e4e6eb;color:var(--text)}
.btn.tab-on{background:#1f2937}
input,textarea{width:100%;padding:10px 12px;border:1px solid #ccd0d5;border-radius:10px;font:14px 'Noto Sans Bengali',sans-serif;background:#fff;margin:4px 0 10px}
textarea{min-height:60px;resize:vertical}
label{font-size:13px;font-weight:600;color:var(--muted)}
#chat{height:50vh;overflow-y:auto;padding:12px;background:#e9edf3;border-radius:12px}
.msg{display:flex;gap:8px;margin:8px 0;align-items:flex-end}
.msg.me{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex:none}
.av.buyer{background:var(--buyer)}.av.seller{background:var(--seller)}.av.admin{background:var(--admin)}.av.bot{background:var(--bot)}
.bub{max-width:72%}
.lbl{font-size:11px;color:var(--muted);margin:0 6px 2px;font-weight:600}
.msg.me .lbl{text-align:right}
.txt{padding:8px 12px;border-radius:14px;color:#fff;white-space:pre-wrap;word-break:break-word;font-size:14px}
.msg.buyer .txt{background:var(--buyer)}.msg.seller .txt{background:var(--seller)}
.msg.admin .txt{background:var(--admin)}.msg.bot .txt{background:var(--bot)}
.sys{text-align:center;font-size:12px;color:var(--muted);margin:8px 0}
.composer{display:flex;gap:8px;margin-top:10px}
.composer input{margin:0;border-radius:99px}
.hide{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c1e21;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9}
small{color:var(--muted)}
</style>
</head>
<body>
<div class="top">🛡️ অ্যাডমিন প্যানেল</div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = t => { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 2200); };
const timeStr = t => new Date(t).toLocaleString('bn-BD', { dateStyle: 'short', timeStyle: 'short' });
let KEY = sessionStorage.getItem('ak') || '';
let tab = 'notifs', openRoom = null, lastCount = -1, lastUn = -1;

const LBL = { buyer: 'ক্রেতা', seller: 'বিক্রেতা', admin: 'অ্যাডমিন', bot: 'বট' };
const AV = { buyer: '🛒', seller: '🏪', admin: '🛡️', bot: '🤖' };
const STEP = {
  join: 'সদস্য অপেক্ষা', roles: 'ভূমিকা বাছাই', amount: 'পরিমাণ অপেক্ষা', pay: 'ক্রেতার পেমেন্ট অপেক্ষা',
  verify: '⚠️ পেমেন্ট যাচাই করুন', deliver: 'ক্রেতার নিশ্চিতকরণ অপেক্ষা', release: '⚠️ বিক্রেতাকে টাকা পাঠান', done: '✅ সম্পন্ন'
};
const TEXT_KEYS = [
  ['welcome', 'ডিল তৈরির বার্তা'], ['roles', 'ভূমিকা বাছাইয়ের বার্তা'], ['amount', 'পরিমাণ চাওয়ার বার্তা'],
  ['pay', 'পেমেন্ট নির্দেশ ({amount} {fee} {feeAmt} {total})'], ['payDetail', 'পেমেন্ট নম্বর বার্তা ({method} {number} {total})'],
  ['sent', 'টাকা পাঠানো হলে বার্তা'], ['verified', 'পেমেন্ট পাওয়ার বার্তা'], ['notPaid', 'পেমেন্ট না পেলে বার্তা'],
  ['received', 'পণ্য পাওয়ার বার্তা'], ['done', 'ডিল সম্পন্নের বার্তা']
];

async function api(p, opt = {}) {
  const r = await fetch('/api/' + p, {
    method: opt.method || 'GET',
    headers: { 'content-type': 'application/json', 'x-admin-key': KEY },
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'সমস্যা হয়েছে');
  return d;
}

function loginView() {
  $('#app').innerHTML = `<div class="card" style="margin-top:30px"><h2>লগইন</h2>
    <input id="pw" type="password" placeholder="অ্যাডমিন পাসওয়ার্ড">
    <button class="btn admin" id="lg">প্রবেশ করুন</button></div>`;
  $('#lg').onclick = async () => {
    KEY = $('#pw').value;
    try { await api('admin/login', { method: 'POST', body: {} }); sessionStorage.setItem('ak', KEY); shell(); }
    catch { toast('ভুল পাসওয়ার্ড'); }
  };
}

function shell() {
  $('#app').innerHTML = `<div class="tabs">
      <button class="btn" data-t="notifs">🔔 নোটিফিকেশন <span id="badge"></span></button>
      <button class="btn" data-t="rooms">📋 ডিলসমূহ</button>
      <button class="btn" data-t="settings">⚙️ সেটিংস</button>
      <button class="btn ghost" id="perm">ব্রাউজার নোটিফিকেশন চালু</button>
    </div><div id="view"></div>`;
  show();
  loadBadge();
  setInterval(() => {
    if (openRoom) { if (!$('#ms') || !$('#ms').value) roomView(openRoom); }
    else if (tab === 'notifs' || tab === 'rooms') show();
    loadBadge();
  }, 4000);
}

async function loadBadge() {
  try {
    const n = await api('admin/notifs');
    const un = n.filter(x => !x.read).length;
    if ($('#badge')) $('#badge').textContent = un ? `(${un})` : '';
    if (lastUn >= 0 && un > lastUn && Notification.permission === 'granted' && n[0])
      new Notification('নতুন নোটিফিকেশন', { body: n[0].text });
    lastUn = un;
  } catch {}
}

async function show() {
  try {
    if (tab === 'notifs') {
      const n = await api('admin/notifs');
      $('#view').innerHTML = `<div class="card"><button class="btn ghost" id="rd">সব পড়া হয়েছে</button></div>` +
        (n.map(x => `<div class="card ${x.read ? '' : 'unread'}"><small>${timeStr(x.t)}</small>
          <div>${esc(x.text)}</div></div>`).join('') || '<div class="card">কোনো নোটিফিকেশন নেই</div>');
    }
    else if (tab === 'rooms') {
      if (openRoom) return roomView(openRoom);
      const rs = await api('admin/rooms');
      $('#view').innerHTML = rs.map(r => `<div class="card">
        <b>ডিল #${esc(r.id)}</b> — ${STEP[r.step]}<br>
        <small>${r.members.map(x => x.role ? `${AV[x.role]} ${LBL[x.role]}` : '👤 সদস্য').join(' • ') || 'কেউ যুক্ত হননি'}${r.amount ? ' | ৳' + r.amount : ''}</small><br>
        <button class="btn" data-open="${esc(r.id)}">খুলুন</button></div>`).join('') || '<div class="card">কোনো ডিল নেই</div>';
    }
    else if (tab === 'settings') await settingsView();
  } catch (e) {
    $('#view').innerHTML = `<div class="card">${esc(e.message)}</div>`;
  }
}

async function settingsView() {
  const s = await api('settings');
  const methods = s.methods.map(x => `${x.name} | ${x.number}`).join('\n');
  $('#view').innerHTML = `<div class="card">
      <h2>সার্ভিস ফি ও পেমেন্ট</h2>
      <label>সার্ভিস ফি (%)</label><input id="fee" type="number" step="0.1" min="0" value="${s.feePercent}">
      <label>পেমেন্ট মাধ্যম (প্রতি লাইনে: নাম | নম্বর)</label>
      <textarea id="methods" style="min-height:90px">${esc(methods)}</textarea>
    </div>
    <div class="card">
      <h2>বটের বার্তা</h2>
      <p>প্রতিটি ধাপে বট কী লিখবে তা এখানে বদলান।</p>
      ${TEXT_KEYS.map(([k, l]) => `<label>${esc(l)}</label><textarea data-tk="${k}">${esc(s.texts[k])}</textarea>`).join('')}
    </div>
    <button class="btn admin" id="sv">সব সেভ করুন</button>`;
}

async function roomView(id) {
  try {
    const rs = await api('admin/rooms');
    const r = rs.find(x => x.id === id);
    if (!r) { openRoom = null; return show(); }
    let act = '';
    if (r.step === 'verify') act = `<button class="btn buyer" data-ra="confirm">✅ পেমেন্ট পেয়েছি</button><button class="btn ghost" data-ra="reject">❌ এখনো পাইনি</button>`;
    if (r.step === 'release') act = `<button class="btn seller" data-ra="released">✅ বিক্রেতাকে টাকা পাঠিয়েছি</button>`;
    const info = r.amount ? `<p>পরিমাণ ৳${r.amount} | ফি ৳${r.fee} | ক্রেতা দেবেন ৳${r.total}</p>` : '';
    const body = r.messages.map(m => {
      if (m.who === 'sys') return `<div class="sys">${esc(m.text)}</div>`;
      return `<div class="msg ${m.who} ${m.who === 'admin' ? 'me' : ''}">
        <div class="av ${m.who}">${AV[m.who] || '•'}</div>
        <div class="bub"><div class="lbl">${LBL[m.who]}</div><div class="txt">${esc(m.text)}</div></div></div>`;
    }).join('');
    const keep = $('#ms') ? $('#ms').value : '';
    $('#view').innerHTML = `<div class="card">
      <button class="btn ghost" data-back="1">← ফিরে যান</button>
      <h2 style="margin-top:8px">ডিল #${esc(r.id)} — ${STEP[r.step]}</h2>
      ${info}
      <div id="chat">${body}</div>
      <div style="margin-top:10px">${act}</div>
      <div class="composer"><input id="ms" placeholder="অ্যাডমিন হিসেবে বার্তা লিখুন"><button class="btn admin" data-ra="msg">পাঠান</button></div>
    </div>`;
    $('#ms').value = keep;
    $('#chat').scrollTop = $('#chat').scrollHeight;
  } catch (e) { $('#view').innerHTML = `<div class="card">${esc(e.message)}</div>`; }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  try {
    if (b.id === 'perm') { Notification.requestPermission(); return; }
    if (b.id === 'rd') { await api('admin/notifs/read', { method: 'POST', body: {} }); return show(); }
    if (b.id === 'sv') {
      const methods = $('#methods').value.split('\n').map(l => {
        const [name, number] = l.split('|').map(x => (x || '').trim());
        return { name, number };
      });
      const texts = {};
      document.querySelectorAll('[data-tk]').forEach(t => texts[t.dataset.tk] = t.value);
      await api('admin/settings', { method: 'POST', body: { feePercent: Number($('#fee').value), methods, texts } });
      return toast('সেভ হয়েছে');
    }
    if (b.dataset.open) { openRoom = b.dataset.open; tab = 'rooms'; return show(); }
    if (b.dataset.back) { openRoom = null; return show(); }
    if (b.dataset.t) { tab = b.dataset.t; openRoom = null; return show(); }
    if (b.dataset.ra) {
      const text = $('#ms') ? $('#ms').value.trim() : '';
      if (b.dataset.ra === 'msg' && !text) return toast('বার্তা লিখুন');
      await api('admin/room/' + openRoom + '/action', { method: 'POST', body: { action: b.dataset.ra, text } });
      if (b.dataset.ra === 'msg' && $('#ms')) $('#ms').value = '';
      return roomView(openRoom);
    }
  } catch (err) { toast(err.message); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'ms') document.querySelector('[data-ra="msg"]').click();
});

KEY ? shell() : loginView();
</script>
</body>
</html>
