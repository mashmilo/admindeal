<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>অ্যাডমিন প্যানেল</title>
<style>
body{font-family:system-ui,'Noto Sans Bengali',sans-serif;margin:0;background:#eef2f7;color:#111}
header{background:#111827;color:#fff;padding:14px;text-align:center;font-weight:600}
main{max-width:620px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.card.unread{border-left:4px solid #f59e0b}
button{background:#1d4ed8;color:#fff;border:0;border-radius:8px;padding:9px 12px;margin:4px 4px 4px 0;font-size:14px;cursor:pointer}
button.alt{background:#64748b}
input{padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;width:100%;box-sizing:border-box;margin:4px 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chat{max-height:45vh;overflow:auto;background:#f8fafc;border-radius:10px;padding:8px}
.m{margin:6px 0;padding:7px 9px;border-radius:9px;background:#f1f5f9;white-space:pre-wrap;font-size:14px}
.m.bot{background:#e0ecff}.m.admin{background:#fef3c7}
.m small{display:block;color:#64748b;font-size:11px}
</style>
</head>
<body>
<header>🛠 অ্যাডমিন প্যানেল</header>
<main id="app"></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY = sessionStorage.getItem('ak') || '';
let tab = 'notifs', openRoom = null, lastUn = -1;

const STEP = {
  join: 'সদস্য অপেক্ষা', roles: 'ভূমিকা বাছাই', amount: 'পরিমাণ দেওয়া হচ্ছে',
  pay: 'ক্রেতার পেমেন্ট অপেক্ষা', verify: '⚠️ পেমেন্ট যাচাই করুন',
  deliver: 'ক্রেতার নিশ্চিতকরণ অপেক্ষা', release: '⚠️ বিক্রেতাকে টাকা পাঠান', done: '✅ সম্পন্ন'
};

async function api(p, opt = {}) {
  const r = await fetch('/api/' + p, {
    method: opt.method || 'GET',
    headers: { 'content-type': 'application/json', 'x-admin-key': KEY },
    body: opt.body ? JSON.stringify(opt.body) : undefined
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'সমস্যা হয়েছে');
  return d;
}

function loginView() {
  $('#app').innerHTML = `<div class="card"><input id="pw" type="password" placeholder="অ্যাডমিন পাসওয়ার্ড">
    <button id="lg">প্রবেশ করুন</button></div>`;
  $('#lg').onclick = async () => {
    KEY = $('#pw').value;
    try { await api('admin/login', { method: 'POST', body: {} }); sessionStorage.setItem('ak', KEY); shell(); }
    catch { alert('ভুল পাসওয়ার্ড'); }
  };
}

function shell() {
  $('#app').innerHTML = `<div class="tabs">
      <button data-t="notifs">🔔 নোটিফিকেশন <span id="badge"></span></button>
      <button data-t="rooms">📋 ডিলসমূহ</button>
      <button data-t="settings">⚙️ সেটিংস</button>
      <button class="alt" id="perm">ব্রাউজার নোটিফিকেশন চালু</button>
    </div><div id="view"></div>`;
  show();
  loadBadge();
  setInterval(() => {
    if (openRoom) { if ($('#ms') && !$('#ms').value) roomView(openRoom); }
    else if (tab !== 'settings') show();
    loadBadge();
  }, 8000);
}

async function loadBadge() {
  try {
    const n = await api('admin/notifs');
    const un = n.filter(x => !x.read).length;
    if ($('#badge')) $('#badge').textContent = un ? `(${un})` : '';
    if (lastUn >= 0 && un > lastUn && Notification.permission === 'granted' && n[0])
      new Notification('নতুন নোটিফিকেশন', { body: n[0].text });
    lastUn = un;
  } catch {}
}

async function show() {
  try {
    if (tab === 'notifs') {
      const n = await api('admin/notifs');
      $('#view').innerHTML = `<div class="card"><button id="rd" class="alt">সব পড়া হয়েছে</button></div>` +
        (n.map(x => `<div class="card ${x.read ? '' : 'unread'}"><small>${new Date(x.t).toLocaleString()}</small>
          <div>${esc(x.text)}</div><button data-open="${esc(x.roomId)}">ডিল খুলুন</button></div>`).join('')
          || '<div class="card">কোনো নোটিফিকেশন নেই</div>');
    }
    else if (tab === 'rooms') {
      if (openRoom) return roomView(openRoom);
      const rs = await api('admin/rooms');
      $('#view').innerHTML = rs.map(r => `<div class="card"><b>ডিল ${esc(r.id)}</b> — ${STEP[r.step]}<br>
        <small>${r.members.map(x => esc(x.name) + (x.role ? ` (${x.role === 'buyer' ? 'ক্রেতা' : 'বিক্রেতা'})` : '')).join(', ') || 'কেউ নেই'}
        ${r.amount ? ' | ৳' + r.amount : ''}</small><br>
        <button data-open="${esc(r.id)}">খুলুন</button></div>`).join('') || '<div class="card">কোনো ডিল নেই</div>';
    }
    else if (tab === 'settings') {
      const s = await api('settings');
      $('#view').innerHTML = `<div class="card">
        <label>সার্ভিস ফি (%)</label><input id="fee" type="number" step="0.1" value="${s.feePercent}">
        <label>বিকাশ নম্বর</label><input id="bk" value="${esc(s.bkash)}">
        <label>নগদ নম্বর</label><input id="ng" value="${esc(s.nagad)}">
        <label>পেমেন্ট নির্দেশনা</label><input id="pt" value="${esc(s.payText)}">
        <button id="sv">সেভ করুন</button></div>`;
    }
  } catch (e) {
    $('#view').innerHTML = `<div class="card">${esc(e.message)}</div>`;
  }
}

async function roomView(id) {
  try {
    const rs = await api('admin/rooms');
    const r = rs.find(x => x.id === id);
    if (!r) { openRoom = null; return show(); }
    let act = '';
    if (r.step === 'verify') act = `<button data-ra="confirm">✅ পেমেন্ট পেয়েছি</button><button class="alt" data-ra="reject">❌ এখনো পাইনি</button>`;
    if (r.step === 'release') act = `<button data-ra="released">✅ বিক্রেতাকে টাকা পাঠিয়েছি</button>`;
    $('#view').innerHTML = `<div class="card">
      <button class="alt" data-back="1">← ফিরে যান</button>
      <h3>ডিল ${esc(r.id)} — ${STEP[r.step]}</h3>
      ${r.amount ? `<p>পরিমাণ ৳${r.amount} | ফি ৳${r.fee} | ক্রেতা দেবেন ৳${r.total}</p>` : ''}
      <div class="chat">${r.messages.map(m => `<div class="m ${m.type}"><small>${esc(m.from)}</small>${esc(m.text)}</div>`).join('')}</div>
      <div style="margin-top:10px">${act}</div>
      <input id="ms" placeholder="চ্যাটে বার্তা লিখুন"><button data-ra="msg">পাঠান</button>
    </div>`;
  } catch (e) { $('#view').innerHTML = `<div class="card">${esc(e.message)}</div>`; }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'perm') { Notification.requestPermission(); return; }
  if (b.id === 'rd') { await api('admin/notifs/read', { method: 'POST', body: {} }); return show(); }
  if (b.id === 'sv') {
    try {
      await api('admin/settings', { method: 'POST', body: {
        feePercent: Number($('#fee').value), bkash: $('#bk').value,
        nagad: $('#ng').value, payText: $('#pt').value
      } });
      alert('সেভ হয়েছে');
    } catch (err) { alert(err.message); }
    return;
  }
  if (b.dataset.open) { openRoom = b.dataset.open; tab = 'rooms'; return show(); }
  if (b.dataset.back) { openRoom = null; return show(); }
  if (b.dataset.t) { tab = b.dataset.t; openRoom = null; return show(); }
  if (b.dataset.ra) {
    try {
      await api('admin/room/' + openRoom + '/action', { method: 'POST',
        body: { action: b.dataset.ra, text: $('#ms') ? $('#ms').value : '' } });
    } catch (err) { alert(err.message); }
    roomView(openRoom);
  }
});

KEY ? shell() : loginView();
</script>
</html>
