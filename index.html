<!doctype html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220" id="themeMeta">
<meta name="description" content="Admin Deal — admin-verified escrow for buyers and sellers. অ্যাডমিন যাচাইকৃত নিরাপদ লেনদেন।">
<title>Admin Deal · নিরাপদ এসক্রো</title>
<script>
(function(){var t='dark';try{t=localStorage.getItem('ad_theme')||'dark'}catch(e){}
document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');})();
</script>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2e59;--navy2:#1e4d8c;--teal:#0d9488;--teal2:#14b8a6;
  --buyer:#2563eb;--seller:#059669;--admin:#7c3aed;
  --bad:#dc2626;
  --bg:#f3f6fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e4e9f2;
  --soft:#f8fafc;--soft2:#eef2f7;--soft3:#e2e8f0;--chatbg:#eef3f9;--inbg:#fff;--inline:#cdd6e3;
  --bar:rgba(255,255,255,.94);--sysbg:#dfe7f1;--syscol:#475569;--accent:#e6f0ff;--accent2:#e6f2ff;--selbg:#f0f6ff;--grab:#cbd5e1;
  --banner:#eef5ff;--bannerline:#cfe2ff;--botline:#d5ece9;--shadow:rgba(15,23,42,.04);
  --font:'Inter','Noto Sans Bengali',system-ui,-apple-system,sans-serif;
}

html[data-theme="dark"]{
  color-scheme:dark;
  --navy:#9ec5ff;--navy2:#3b6fb8;
  --bg:#0b1220;--card:#131c2e;--text:#e6ebf5;--muted:#93a1b8;--line:#243049;
  --soft:#18233a;--soft2:#1b2740;--soft3:#26344f;--chatbg:#0e1628;--inbg:#0f1829;--inline:#2d3b58;
  --bar:rgba(19,28,46,.94);--sysbg:#223048;--syscol:#b6c2d6;--accent:#1b2f55;--accent2:#1b2f55;--selbg:#182a4a;--grab:#3a4a68;
  --banner:#14264a;--bannerline:#274575;--botline:#1f4a4a;--shadow:rgba(0,0,0,.25);
}
html[data-theme="dark"] .btn{background:linear-gradient(135deg,#2f5fa8,#1e4d8c)}
html[data-theme="dark"] .btn.buyer{background:linear-gradient(135deg,#3b82f6,var(--buyer))}
html[data-theme="dark"] .btn.seller{background:linear-gradient(135deg,#34d399,var(--seller))}
html[data-theme="dark"] .btn.teal{background:linear-gradient(135deg,var(--teal2),var(--teal))}
html[data-theme="dark"] .btn.fb{background:#1877f2}
html[data-theme="dark"] .btn.ghost{background:var(--soft2);color:var(--text)}
html[data-theme="dark"] .logo{color:#e6ebf5}
html[data-theme="dark"] h2,html[data-theme="dark"] .rolebtn b{color:#e6ebf5}
html[data-theme="dark"] .badge{background:#1b2f55;color:#9ec5ff}
html[data-theme="dark"] .badge.done,html[data-theme="dark"] .pill.ok{background:#064e3b;color:#6ee7b7}
html[data-theme="dark"] .badge.cancelled,html[data-theme="dark"] .pill.bad{background:#4c1d1d;color:#fca5a5}
html[data-theme="dark"] .pill,html[data-theme="dark"] .you{background:#1b2f55;color:#9ec5ff}
html[data-theme="dark"] .step .n{color:#9ec5ff}
html[data-theme="dark"] .checks li:before{background:#064e3b;color:#6ee7b7}
html[data-theme="dark"] .banner.share{background:#08302b;border-color:#14584f}
html[data-theme="dark"] .msg.bot .txt{background:#18233a;color:var(--text)}
html[data-theme="dark"] .toast{background:#e6ebf5;color:#0b1220}
html[data-theme="dark"] .avatar-btn{border-color:var(--card)}
html[data-theme="dark"] .av{border-color:var(--card)}
html[data-theme="dark"] .av.bot{background:#fff}
html[data-theme="dark"] .overlay{background:rgba(0,0,0,.6)}
.theme-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--soft2);color:var(--text);cursor:pointer;font-size:17px;display:grid;place-items:center;padding:0;flex:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}
a{color:inherit}

/* App bar */
.appbar{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;background:var(--bar);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy)}
.logo img{width:32px;height:32px}
.logo b{display:block;font-size:17px;font-weight:800;letter-spacing:-.2px;line-height:1.1}
.logo small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.bar-actions{display:flex;align-items:center;gap:8px}
.avatar-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 2px var(--navy2);overflow:hidden;background:var(--soft3);cursor:pointer;padding:0}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font:600 15px var(--font);cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--navy2),var(--navy));box-shadow:0 4px 14px rgba(11,46,89,.22);transition:transform .08s,filter .2s;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.buyer{background:linear-gradient(135deg,#3b82f6,var(--buyer));box-shadow:0 4px 14px rgba(37,99,235,.25)}
.btn.seller{background:linear-gradient(135deg,#34d399,var(--seller));box-shadow:0 4px 14px rgba(5,150,105,.25)}
.btn.teal{background:linear-gradient(135deg,var(--teal2),var(--teal));box-shadow:0 4px 14px rgba(13,148,136,.25)}
.btn.ghost{background:var(--soft2);color:var(--text);box-shadow:none}
.btn.light{background:#fff;color:#0b2e59;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.btn.ghostlight{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:none}
.btn.fb{background:#1877f2;box-shadow:none}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.lg{padding:14px 24px;font-size:16px;border-radius:14px}
.btn.block{width:100%}

/* Shared */
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 6px 20px var(--shadow)}
h2{margin:0 0 6px;font-size:20px;letter-spacing:-.3px;color:var(--navy)}
h3{margin:0 0 4px;font-size:15.5px}
p{margin:6px 0;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.label{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,textarea{width:100%;padding:13px 14px;border:1px solid var(--inline);border-radius:12px;font:15px var(--font);background:var(--inbg);outline:none;color:var(--text)}
input:focus,textarea:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(30,77,140,.14)}
textarea{min-height:90px;resize:vertical}

/* Home */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:34px 28px;color:#fff;background:radial-gradient(circle at 88% 15%,rgba(20,184,166,.38),transparent 45%),linear-gradient(135deg,#0b2e59,#1e4d8c 60%,#0f766e);display:grid;grid-template-columns:1.5fr 1fr;align-items:center;gap:16px;box-shadow:0 20px 40px rgba(11,46,89,.25)}
.tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;margin-bottom:14px}
.hero h1{margin:0 0 12px;font-size:32px;line-height:1.2;letter-spacing:-.6px}
.hero h1 span{display:block;font-size:18px;font-weight:600;opacity:.9;margin-top:6px}
.hero p{color:rgba(255,255,255,.88);margin:0 0 22px;max-width:520px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-art{justify-self:center;width:170px;height:170px;animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.step .n{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--accent2);color:var(--navy2);font-weight:800;margin-bottom:10px}
.step h3{font-size:14.5px}
.step p{font-size:13px;margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{list-style:none;padding:0;margin:8px 0 0}
.checks li{padding:9px 0 9px 30px;position:relative;color:var(--muted);border-top:1px solid var(--line);font-size:14px}
.checks li:before{content:"✓";position:absolute;left:4px;top:9px;width:19px;height:19px;border-radius:50%;background:#d1fae5;color:#047857;font-size:12px;display:grid;place-items:center;font-weight:800}
.support-card{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:22px}

/* Deal room */
.deal{max-width:760px;margin:0 auto;background:var(--card);height:calc(100vh - 58px);height:calc(100dvh - 58px);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
.deal-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft2);text-decoration:none;color:var(--text);font-size:17px;flex:none;border:0;cursor:pointer}
.icon-btn:hover{background:var(--soft3)}
.dtitle{font-weight:700;font-size:15.5px}
.dsub{font-size:12.5px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--accent);color:var(--navy2);white-space:nowrap}
.pill.ok{background:#d1fae5;color:#047857}.pill.bad{background:#fee2e2;color:#b91c1c}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal2),var(--navy2));transition:width .4s}
.people{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.person{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:var(--soft);border:1px solid var(--line);min-width:0}
.person.link{cursor:pointer}
.person.empty{opacity:.6;border-style:dashed}
.pname{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.you{font-size:10.5px;background:var(--accent);color:var(--navy2);padding:1px 6px;border-radius:99px;margin-left:4px;font-weight:700}
.av{width:34px;height:34px;border-radius:50%;flex:none;object-fit:cover;background:var(--soft3);border:2px solid var(--card);display:block}
.av.lg{width:42px;height:42px}
.av.buyer{box-shadow:0 0 0 2px var(--buyer)}
.av.seller{box-shadow:0 0 0 2px var(--seller)}
.av.bot{background:#fff;box-shadow:0 0 0 2px var(--teal2);padding:2px}
.av.admin{display:grid;place-items:center;background:linear-gradient(135deg,#a78bfa,var(--admin));font-size:16px;border:0}
.banner{margin:10px 12px 0;padding:12px 14px;border-radius:14px;background:var(--banner);border:1px solid var(--bannerline);display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.banner b{font-size:14px}
.banner.share{background:#ecfdf5;border-color:#a7f3d0}
.chat{flex:1;min-height:0;overflow-y:auto;padding:14px 12px;background:var(--chatbg)}
.msg{display:flex;gap:8px;margin:12px 0;align-items:flex-end}
.msg.me{flex-direction:row-reverse}
.bub{max-width:76%;min-width:0}
.lbl{font-size:11.5px;color:var(--muted);margin:0 10px 3px;font-weight:600}
.msg.me .lbl{text-align:right}
.txt{padding:10px 14px;border-radius:18px;color:#fff;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 6px rgba(15,23,42,.08);font-size:14.5px}
.msg.buyer .txt{background:linear-gradient(135deg,#3b82f6,var(--buyer))}
.msg.seller .txt{background:linear-gradient(135deg,#34d399,var(--seller))}
.msg.admin .txt{background:linear-gradient(135deg,#a78bfa,var(--admin))}
.msg.bot .bub{max-width:82%}
.msg.bot .txt{background:var(--card);color:var(--text);border:1px solid var(--botline);border-left:3px solid var(--teal2)}
.msg.me .txt{border-bottom-right-radius:5px}
.msg:not(.me) .txt{border-bottom-left-radius:5px}
.tm{font-size:10.5px;color:var(--muted);margin:3px 10px 0}
.msg.me .tm{text-align:right}
.sysline{text-align:center;margin:12px 0}
.sysline span{display:inline-block;font-size:12px;color:var(--syscol);background:var(--sysbg);padding:4px 12px;border-radius:99px}
.empty{text-align:center;color:var(--muted);font-size:13.5px;margin-top:36px}
.actions{padding:12px;border-top:1px solid var(--line);background:var(--card)}
.actions:empty{display:none}
.note{font-size:14px;color:var(--muted);text-align:center;padding:4px 0}
.composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card)}
.composer input{border-radius:99px;padding:11px 16px}

/* Sheets */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.open{display:flex}
.sheet{background:var(--card);color:var(--text);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:22px;max-height:85vh}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--grab);margin:-8px auto 14px}
.linkbox{display:flex;gap:8px;align-items:center;margin-top:10px}
.linkbox input{flex:1;font-size:13px;padding:11px 12px;background:var(--soft)}
.share-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.share-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:14px;background:var(--soft);border:1px solid var(--line);text-decoration:none;color:var(--text);font:600 12.5px var(--font);cursor:pointer}
.share-btn span{font-size:20px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.rolebtn{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:26px}
.rolebtn b{font-size:14.5px;color:var(--text)}
.rolebtn span{font-size:12px;color:var(--muted)}
.rolebtn.sel{border-color:var(--navy2);background:var(--selbg);box-shadow:0 0 0 3px rgba(30,77,140,.12)}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pav{width:64px;height:64px;border-radius:50%;overflow:hidden;flex:none;background:var(--soft3)}
.pav img{width:100%;height:100%;object-fit:cover;display:block}
.pn{font-weight:800;font-size:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 16px}
.stats div{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:17px}
.stats span{font-size:11px;color:var(--muted)}
.stats .bad b{color:var(--bad)}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent);color:var(--navy2)}
.badge.done{background:#d1fae5;color:#047857}.badge.cancelled{background:#fee2e2;color:#b91c1c}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;display:none;z-index:99;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}

@media (max-width:760px){.hero{grid-template-columns:1fr;padding:26px 22px}.hero-art{display:none}.steps{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media (max-width:420px){.steps{grid-template-columns:1fr}.hero h1{font-size:26px}.stats{grid-template-columns:repeat(2,1fr)}.share-grid{grid-template-columns:repeat(2,1fr)}.bub{max-width:82%}}
</style>
</head>
<body>
<header class="appbar">
  <a class="logo" href="/"><img src="/assets/logo.svg" alt=""><div><b>Admin Deal</b><small>Secure escrow · নিরাপদ এসক্রো</small></div></a>
  <div class="bar-actions">
    <button class="theme-btn" id="themeBtn" aria-label="Theme" title="Dark / Light"></button>
    <button class="btn ghost sm" data-support="1">💬 Support</button>
    <div id="authBox"></div>
  </div>
</header>

<main id="app"></main>

<div class="overlay" id="sheet"><div class="sheet" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = t => { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = 'none', 2400); };
const dateStr = t => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const timeStr = t => new Date(t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

const ROLE_EN = { buyer: 'Buyer', seller: 'Seller' };
const ROLE_BN = { buyer: 'ক্রেতা', seller: 'বিক্রেতা' };
const STEP = {
  join: 'অপেক্ষা · Waiting', amount: 'পরিমাণ · Amount', pay: 'পেমেন্ট · Payment',
  verify: 'যাচাই · Verifying', deliver: 'ডেলিভারি · Delivery', release: 'রিলিজ · Releasing', done: 'সম্পন্ন · Completed'
};
const STEP_ORDER = ['join', 'amount', 'pay', 'verify', 'deliver', 'release', 'done'];
const STATUS = { active: 'চলছে · In progress', done: 'সম্পন্ন · Completed', cancelled: 'বাতিল · Cancelled' };
const MANUAL = ['verify', 'deliver', 'release', 'done'];
const HUMAN = '/assets/avatar.svg', BOT = '/assets/bot.svg';


/* ---------- Theme (default: dark) ---------- */
function getTheme() { return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark'; }
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('ad_theme', t); } catch {}
  const b = $('#themeBtn'); if (b) b.textContent = t === 'dark' ? '☀️' : '🌙';
  const m = $('#themeMeta'); if (m) m.content = t === 'dark' ? '#0b1220' : '#ffffff';
}
applyTheme(getTheme());

/* storage that never throws (private/in-app browsers) */
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch { return window.__mem && window.__mem[k] || ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { (window.__mem = window.__mem || {})[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch { if (window.__mem) delete window.__mem[k]; } }
};

const roomId = new URLSearchParams(location.search).get('room');
let session = store.get('ad_session');
let ME = null, SET = { methods: [], googleClientId: '', fbAppId: '', supportWhatsapp: '', supportTelegram: '' };
let S = null, memberId = roomId ? store.get('mem_' + roomId) : '';
let pollSeq = 0, joined = false;
let lastMsgCount = -1, lastStep = null, lastPanel = '', lastBanner = '', pollErr = '', justSent = false, joinRole = '';

const shareUrl = () => location.origin + '/?room=' + roomId;

async function api(p, o = {}) {
  const h = { 'content-type': 'application/json' };
  if (session) h.authorization = 'Bearer ' + session;
  const mh = o.member !== undefined ? o.member : memberId;
  if (mh) h['x-member'] = mh;
  if (o.admin) h['x-admin-key'] = o.admin;
  const r = await fetch('/api/' + p, {
    method: o.method || 'GET', headers: h,
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong');
  return d;
}

function renderDeal() {
  const r = S;
  const mine = r.mine || { isMember: false, role: null, isCreator: false };
  const ended = r.status !== 'active';
  if (mine.isMember) joined = true;
  const full = r.members.length >= 2;
  if (mine.isMember) joined = true;

  // Remember membership the server recognises (e.g. after signing in on another device)
  if (!memberId && mine.memberId) {
    memberId = mine.memberId;
    store.set('mem_' + roomId, memberId);
  }

  const pill = $('#pill');
  pill.textContent = ended ? STATUS[r.status] : STEP[r.step];
  pill.className = 'pill' + (r.status === 'done' ? ' ok' : r.status === 'cancelled' ? ' bad' : '');

  const idx = STEP_ORDER.indexOf(r.step);
  $('#prog').style.width = (ended ? 100 : (Math.max(idx, 0) / (STEP_ORDER.length - 1)) * 100) + '%';

  $('#dsub').textContent = ended ? STATUS[r.status]
    : !full ? 'অন্য পক্ষের অপেক্ষা · Waiting for the other party'
    : r.amount ? `পরিমাণ ৳${r.amount} · মোট ৳${r.total}` : 'পরিমাণ বাকি · Amount pending';

  // Copy/share is only for the creator, and only while the second person has not joined
  $('#shareIcon').hidden = !(mine.isCreator && !full && !ended);

  renderPeople(r, mine, ended);
  renderBanner(r, mine, ended);

  const chat = $('#chat');
  if (r.messages.length !== lastMsgCount || r.step !== lastStep) {
    const near = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120;
    chat.innerHTML = r.messages.length
      ? r.messages.map(m => msgHTML(m, mine.role)).join('')
      : '<div class="empty">এখনো কোনো মেসেজ নেই · No messages yet 👋</div>';
    if (lastMsgCount < 0 || near || justSent) chat.scrollTop = chat.scrollHeight;
    lastMsgCount = r.messages.length;
    lastStep = r.step;
  }
  justSent = false;

  // Chat is open to both parties once the bot steps are done
  const canChat = mine.isMember && !!mine.role && !ended && MANUAL.includes(r.step);
  $('#composer').hidden = !canChat;

  const h = actionHTML(r, mine, ended);
  if (h !== lastPanel) { $('#panel').innerHTML = h; lastPanel = h; }
}

    case 'verify':

    default: return '';
  }
}

async function poll() {
  const seq = ++pollSeq, mh = memberId;
  try {
    const d = await api('room/' + roomId, { member: mh });
    if (seq !== pollSeq || mh !== memberId) return;   // stale reply (e.g. sent before joining) — ignore
    S = d;
    pollErr = '';
    renderDeal();
  } catch (e) {
    if (pollErr !== e.message) { toast(e.message); pollErr = e.message; }
  }
}

async function sendMsg() {
  const i = $('#txt');
  const text = i.value.trim();
  if (!text) return;
  i.value = '';

  try {
    pollSeq++;
    S = await api(`room/${roomId}/msg`, { method: 'POST', body: { memberId, text } });
    renderDeal();
  } catch (e) {
    i.value = text;
    justSent = false;

  }
}

  try {

    t.value = url;
    t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t);

    try { document.execCommand('copy'); } catch {}
    t.remove();
  }

      <div><b>${rate}</b><span>সফলতা · Success</span></div>
      <div><b>${s.done}</b><span>সম্পন্ন · Done</span></div>
      <div class="${s.scamReports ? 'bad' : ''}"><b>${s.scamReports}</b><span>রিপোর্ট · Reports</span></div>
    </div>
    ${mineView ? `<h3 style="margin:14px 0 2px">আমার ডিলসমূহ · My deals</h3>${dealsHTML(s.deals)}
      <button class="btn ghost block" id="logout" style="margin-top:14px">লগ আউট · Log out</button>` : ''}
    <button class="btn ghost block" data-close="1" style="margin-top:10px">বন্ধ করুন · Close</button>`;
}

async function openProfile(uid) {
  const d = await api('profile/' + encodeURIComponent(uid));
  sheet(profileHTML(d.user, d.stats, false));
}

async function openMe() {
  const d = await api('me');
  ME = d.user;
  renderAuth();
  sheet(profileHTML(d.user, d.stats, true));
}

function openLogin() {
  sheet(`<h2>Sign in · সাইন ইন</h2>
    <p>ঐচ্ছিক। প্রোফাইল, ডিলের ইতিহাস ও রেপিউটেশন তৈরি করতে সাইন ইন করুন।</p>
    ${SET.googleClientId ? '<div id="gbtn" class="row" style="justify-content:center;margin:14px 0"></div>' : ''}
    ${SET.fbAppId ? '<button class="btn fb block" id="fbBtn" style="margin:8px 0">Continue with Facebook</button>' : ''}
    ${!SET.googleClientId && !SET.fbAppId ? '<p>সাইন-ইন এখনো সেট করা হয়নি। গেস্ট হিসেবে চালিয়ে যান · Sign-in is not set up yet.</p>' : ''}
    <button class="btn ghost block" data-close="1" style="margin-top:8px">গেস্ট হিসেবে চালু রাখুন · Continue as guest</button>`);
  loadGoogle();
  loadFB();
}

function loadGoogle() {
  if (!SET.googleClientId) return;
  const init = () => {
    google.accounts.id.initialize({
      client_id: SET.googleClientId,
      callback: r => doLogin('auth/google', { credential: r.credential })
    });
    const el = $('#gbtn');
    if (el) google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', shape: 'pill', width: 280 });
  };
  if (window.google && google.accounts) return init();
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.async = true;
  s.onload = init;
  document.head.appendChild(s);
}

function loadFB() {
  if (!SET.fbAppId) return;
  window.fbAsyncInit = () => FB.init({ appId: SET.fbAppId, cookie: true, xfbml: false, version: 'v19.0' });
  if (!window.FB) {
    const s = document.createElement('script');
    s.src = 'https://connect.facebook.net/en_US/sdk.js';
    s.async = true; s.defer = true; s.crossOrigin = 'anonymous';
    document.head.appendChild(s);
  } else window.fbAsyncInit();
}

function fbLogin() {
  if (!window.FB) return toast('Facebook লোড হচ্ছে, আবার চেষ্টা করুন');
  FB.login(res => {
    if (res.authResponse) doLogin('auth/facebook', { accessToken: res.authResponse.accessToken });
    else toast('Facebook login বাতিল হয়েছে');
  }, { scope: 'public_profile' });
}

async function doLogin(path, body) {
  const d = await api(path, { method: 'POST', body });
  session = d.token;
  store.set('ad_session', session);
  ME = d.user;
  closeSheet();
  renderAuth();
  if (roomId) { lastBanner = ''; poll(); }
  else home();
  toast('সাইন ইন হয়েছে · Signed in');
}

function logout() {
  session = '';
  store.del('ad_session');
  ME = null;
  closeSheet();
  renderAuth();
  toast('লগ আউট হয়েছে · Logged out');
}

function openReport() {
  sheet(`<h2>এই ব্যবহারকারীকে রিপোর্ট করুন · Report user</h2>
    <p>শুধু প্রকৃত প্রতারণা বা গুরুতর সমস্যার ক্ষেত্রে রিপোর্ট করুন। অ্যাডমিন প্রতিটি রিপোর্ট দেখেন।</p>
    <textarea id="rtxt" maxlength="300" placeholder="কী ঘটেছে? · What happened?"></textarea>
    <button class="btn block" id="sendReport" style="margin-top:10px">রিপোর্ট জমা দিন · Submit</button>
    <button class="btn ghost block" data-close="1" style="margin-top:8px">বাতিল · Cancel</button>`);
}

async function sendReport() {
  const reason = $('#rtxt').value.trim();
  if (!reason) return toast('কারণ লিখুন · Write a reason');
  await api(`room/${roomId}/report`, { method: 'POST', body: { memberId, reason } });
  closeSheet();
  toast('রিপোর্ট জমা হয়েছে · Report submitted');
}

/* ---------- Events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-profile]');
  if (!t) return;
  try {
    if (t.id === 'themeBtn') return applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
    if (t.id === 'newDeal') return await newDeal();
    if (t.id === 'loginBtn' || t.id === 'loginCta') return openLogin();
    if (t.id === 'myProfile') return await openMe();
    if (t.id === 'fbBtn') return fbLogin();
    if (t.id === 'joinBtn') return openJoin();
    if (t.id === 'joinGo') return submitJoin();
    if (t.id === 'send') return await sendMsg();
    if (t.id === 'reportBtn') return openReport();
    if (t.id === 'sendReport') return await sendReport();
    if (t.id === 'logout') return logout();
    if (t.id === 'nativeShare') return navigator.share({ title: 'Admin Deal', text: `Deal #${roomId}`, url: shareUrl() }).catch(() => {});
    if (t.dataset.r) {
      joinRole = t.dataset.r;
      document.querySelectorAll('.rolebtn').forEach(b => b.classList.toggle('sel', b === t));
      return;
    }
    if (t.dataset.support !== undefined) return openSupport();
    if (t.dataset.copy !== undefined) return await copyLink();
    if (t.dataset.share !== undefined) return openShare();
    if (t.dataset.close !== undefined) return closeSheet();
    if (t.dataset.profile) return await openProfile(t.dataset.profile);
    if (t.dataset.a) return await act(t.dataset.a, t.dataset.v);
  } catch (err) { toast(err.message); }
});

$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'txt') {
    e.preventDefault();
    sendMsg().catch(err => toast(err.message));
  }
  if (e.key === 'Enter' && e.target.id === 'jName') {
    e.preventDefault();
    Promise.resolve(submitJoin()).catch(err => toast(err.message));
  }
});

/* ---------- Start ---------- */
async function init() {
  try { SET = await api('settings'); } catch {}
  if (session) {
    try { ME = (await api('me')).user; }
    catch { session = ''; store.del('ad_session'); }
  }
  renderAuth();
  if (roomId) {
    dealShell();
    await poll();
    setInterval(poll, 2500);
  } else {
    home();
  }
  setInterval(async () => { try { SET = await api('settings'); } catch {} }, 20000);
}
init();
</script>
</body>
</html>
